name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 */5 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            "${{ secrets.SUPABASE_URL }}/auth/v1/health")
          echo "Response code: $response"
          if [ "$response" -ge 200 ] && [ "$response" -lt 500 ]; then
            echo "Pinged Supabase successfully ✅"
          else
            echo "Ping failed with status $response ❌"
            exit 1
          fi
